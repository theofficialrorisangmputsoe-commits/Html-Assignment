<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kingdom In The Sky - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lesotho.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="home">
    <nav>
        <h1 class="topbar">Contact & Booking</h1>
        <ul>
            <li><a href="Home.html">Home</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="services_products.html">Services/Products</a></li>
            <li><a href="gallery2.html">Gallery</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="container my-5" style="margin-top: 120px !important;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow-sm" style="background-color: #ffffff; border: 2px solid #141438;">
                    <h2 class="mb-3 text-center" style="color: #141438;">Get in Touch / Book a Tour</h2>
                    <p class="text-center text-muted mb-4">Fill out the form below to book your adventure.</p>

                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required pattern="[A-Za-z\s]+" maxlength="20">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-bold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" placeholder="+266 ..." required pattern="[0-9+\s-]{6,}" maxlength="8">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required minlength="6">
                        </div>

                        <div class="mb-3">
                            <label for="gender" class="form-label fw-bold">Gender</label>
                            <select class="form-select" id="gender" required>
                                <option value="" selected disabled>Choose...</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label fw-bold">Inquiry / Message</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Tell us about the trip you'd like to book..." required></textarea>
                        </div>

                        <button type="submit" class="btn w-100 fw-bold" style="background-color: #141438; color: #ffd700;">Submit Registration</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="image-references">
            <p>&copy; 2026 Kingdom In The Sky. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
